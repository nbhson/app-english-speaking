
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="FluentDev — AI English Speaking Coach for software developers. Luyện nói tiếng Anh cho dev." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FluentDev AI Coach</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Design system: mono = code + metric numerals (dev-tool identity) -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme class before first paint (prevents light-mode flash
      // for dark-mode users). Mirrors the logic in App.tsx useDarkMode state.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
