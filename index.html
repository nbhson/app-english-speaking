
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluentDev AI Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: 'rgb(var(--slate-50) / <alpha-value>)',
                100: 'rgb(var(--slate-100) / <alpha-value>)',
                200: 'rgb(var(--slate-200) / <alpha-value>)',
                300: 'rgb(var(--slate-300) / <alpha-value>)',
                400: 'rgb(var(--slate-400) / <alpha-value>)',
                500: 'rgb(var(--slate-500) / <alpha-value>)',
                600: 'rgb(var(--slate-600) / <alpha-value>)',
                700: 'rgb(var(--slate-700) / <alpha-value>)',
                800: 'rgb(var(--slate-800) / <alpha-value>)',
                900: 'rgb(var(--slate-900) / <alpha-value>)',
                950: 'rgb(var(--slate-950) / <alpha-value>)',
              },
              blue: {
                50: 'rgb(var(--blue-50) / <alpha-value>)',
                100: 'rgb(var(--blue-100) / <alpha-value>)',
                200: 'rgb(var(--blue-200) / <alpha-value>)',
                300: 'rgb(var(--blue-300) / <alpha-value>)',
                400: 'rgb(var(--blue-400) / <alpha-value>)',
                500: 'rgb(var(--blue-500) / <alpha-value>)',
                600: 'rgb(var(--blue-600) / <alpha-value>)',
                700: 'rgb(var(--blue-700) / <alpha-value>)',
                800: 'rgb(var(--blue-800) / <alpha-value>)',
                900: 'rgb(var(--blue-900) / <alpha-value>)',
              },
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      /* Color scales are exposed as CSS vars so the same slate/blue classes
         resolve to light values by default and to the neutral black/gray
         palette whenever the .dark class is set (see tailwind.config above). */
      :root {
        /* slate — Tailwind defaults (light mode) */
        --slate-50: 248 250 252;
        --slate-100: 241 245 249;
        --slate-200: 226 232 240;
        --slate-300: 203 213 225;
        --slate-400: 148 163 184;
        --slate-500: 100 116 139;
        --slate-600: 71 85 105;
        --slate-700: 51 65 85;
        --slate-800: 30 41 59;
        --slate-900: 15 23 42;
        --slate-950: 2 6 23;
        /* blue — Tailwind defaults (light mode) */
        --blue-50: 239 246 255;
        --blue-100: 219 234 254;
        --blue-200: 191 219 254;
        --blue-300: 147 197 253;
        --blue-400: 96 165 250;
        --blue-500: 59 130 246;
        --blue-600: 37 99 235;
        --blue-700: 29 78 216;
        --blue-800: 30 64 175;
        --blue-900: 30 58 138;
      }
      .dark {
        /* slate — neutral black/gray scale (Tailwind "neutral"):
           BACKGROUND #0a0a0a / PANEL #171717 / CARD #262626
           TEXT #f5f5f5 / muted #a3a3a3 */
        --slate-50: 250 250 250;
        --slate-100: 245 245 245;
        --slate-200: 229 229 229;
        --slate-300: 212 212 212;
        --slate-400: 163 163 163;
        --slate-500: 115 115 115;
        --slate-600: 82 82 82;
        --slate-700: 64 64 64;
        --slate-800: 38 38 38;
        --slate-900: 23 23 23;
        --slate-950: 10 10 10;
        /* blue — no override, dark mode uses the standard blue accent from :root */
      }
      .dark body {
        background-color: #0a0a0a;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
